services:
  # Service PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: 2bibsah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: 2bibsah_user
      POSTGRES_PASSWORD: 2bibsah_password
      POSTGRES_DB: 2bibsah_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2bibsah_user -d 2bibsah_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 2bibsah-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 2bibsah-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://2bibsah_user:2bibsah_password@postgres:5432/2bibsah_dev?schema=public
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production-avec-un-secret-fort}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # Pour le hot-reload sur Windows avec Docker
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 2bibsah-network
    command: sh -c "echo '⏳ Attente de PostgreSQL...' && sleep 5 && npx prisma db push --accept-data-loss && echo '✅ Base de données initialisée' && npm run dev"

  # Adminer - Interface web pour gérer PostgreSQL
  adminer:
    image: adminer:latest
    container_name: 2bibsah-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - 2bibsah-network

volumes:
  postgres_data:
    driver: local

networks:
  2bibsah-network:
    driver: bridge
